{{- /* Deployment is only rendered when workload type is not StatefulSet */ -}}
{{- if ne .Values.workload.type "StatefulSet" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "azure-web-app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "azure-web-app.labels" . | nindent 4 }}
spec:
  {{- /* Omit replicas when HPA is enabled — the HPA controller owns the replica count */ -}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "azure-web-app.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0     # Zero-downtime: never go below desired replica count
  template:
    metadata:
      labels:
        {{- include "azure-web-app.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "azure-web-app.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}

      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "azure-web-app.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP

          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            - name: NODE_ENV
              value: production
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- if .Values.configmap.enabled }}
            {{- range $key, $val := .Values.configmap.data }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "azure-web-app.fullname" $ }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}

          # Blocks liveness/readiness checks until the app has had time to start up
          startupProbe:
            httpGet:
              path: {{ .Values.probes.startup.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}

          # Restarts the container if it stops responding (deadlock, OOM, etc.)
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}

          # Removes the pod from the Service endpoints until it is ready to accept traffic
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          lifecycle:
            preStop:
              exec:
                # Allow in-flight requests to drain before SIGTERM is sent
                command: ["/bin/sh", "-c", "sleep 5"]

      terminationGracePeriodSeconds: 30
{{- end }}
