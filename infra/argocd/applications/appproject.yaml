apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: azure-web-app
  namespace: argocd
spec:
  description: Azure Web App project — restricts source repos, destination namespaces, and allowed resources.

  sourceRepos:
    - https://github.com/manjeetops/azure-web-app.git

  destinations:
    - server: https://kubernetes.default.svc
      namespace: azure-web-app

  clusterResourceWhitelist:
    - group: ""
      kind: Namespace

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: external-secrets.io
      kind: ExternalSecret
