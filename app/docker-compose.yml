version: "3.9"

services:

  app:

    # ── Build ────────────────────────────────────────────────────────────────
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: azure-web-app:local
    container_name: azure-web-app

    # ── Network ──────────────────────────────────────────────────────────────
    ports:
      - "3000:3000"

    # ── Environment ──────────────────────────────────────────────────────────
    environment:
      NODE_ENV: development
      APP_VERSION: "1.0.0-local"
      PORT: "3000"

    # ── Health check ─────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

    # ── Runtime behaviour ────────────────────────────────────────────────────
    restart: unless-stopped

    # ── Resource limits ──────────────────────────────────────────────────────
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "128M"
        reservations:
          cpus: "0.1"
          memory: "64M"
